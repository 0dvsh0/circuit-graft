[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "circuitgraft"
version = "0.1.0"
description = "Circuit-aware safety recovery for domain-fine-tuned Cohere Tiny Aya models"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "CircuitGraft team" }]
keywords = ["safety", "mechanistic-interpretability", "circuit", "fine-tuning", "tiny-aya"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Versions are floors while the D1 source inspection is in progress. The
# resolved environment is frozen into requirements-*.lock (see docs/API_NOTES.md).
dependencies = [
  "torch>=2.7",
  "transformers>=5.15,<6",
  "datasets>=3.0,<6",
  "accelerate>=0.24,<2",
  "peft>=0.6,<1",
  "trl>=0.12,<1.15",
  "huggingface-hub>=1.5,<2",
  "safetensors>=0.4",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=12.0",
  "tqdm>=4.66",
  "safetune==0.1.12",
  "circuitkit==0.2.0",
  "auditkit==1.1.3",
  "curatorkit[generation,hf]==0.1.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "ipykernel>=6.0",
]
report = ["matplotlib>=3.8", "seaborn>=0.13", "plotly>=5.20"]
space = ["gradio>=5.0"]

[project.scripts]
cg = "circuitgraft.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/circuitgraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "gpu: requires a CUDA GPU and the gated Tiny Aya checkpoints (opt-in)",
  "slow: long-running test",
]
filterwarnings = [
  "ignore::DeprecationWarning:transformers.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "space"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's API is built around option/argument calls in function defaults.
"src/circuitgraft/cli.py" = ["B008"]

[tool.circuitgraft]
# Consumed by scripts/check_env.py; kept in the project file so the expected
# dependency surface is explicit.
env_main = ["safetune", "auditkit", "curatorkit"]
env_circuit = ["circuitkit", "transformer_lens"]
