models:
  - aligned
  - drifted
  - resta
  - wiseft
  - ctheta
  - safelora
  - cg_project
  - cg_uniform
  - cg_exclude
  - cg_fisher
  - cg_distributed
  - cg_random

benchmarks:
  - harmbench
  - advbench
  - sorrybench
  - domain_harmful
  - xstest_safe
  - orbench_hard
  - domain_benign
  - medmcqa_validation
  - medqa_test
  - pubmedqa_labeled
  - mmlu_non_medical

generation:
  max_new_tokens_safety: 256
  max_new_tokens_mcq: 32
  batch_size: 8
  temperature: 0.0
  do_sample: false
  seed: 0
  use_chat_template: true
  include_system_preamble: false
  record_letter_logits: true
  max_prompt_tokens: 4096

judge:
  primary: wildguard
  secondary: string_match
  guard_model: allenai/wildguard
  auditkit_guard: null
  human_audit_per_model: 100
  max_new_tokens: 4
  # WildGuard is a 7B judge. Leave false unless you intentionally want a very
  # slow CPU run; without CUDA the primary judge is recorded as not_run and
  # string-match metrics are the declared fallback.
  allow_cpu: false

bootstrap_resamples: 1000
bootstrap_ci: 0.95
data_dir: artifacts/data
generations_dir: results/generations
output_dir: artifacts/eval
audit_output_dir: artifacts/audit
# Explicit logical name -> local checkpoint / HF id overrides. Missing entries
# are discovered from the artifacts/ tree; a missing model is an error.
model_paths: {}
# Per-benchmark row caps for quick runs; empty means use every eval row.
# 2026-11-13 deviation (approved): caps for the local RX 6600 Phase 4 run,
# logged in docs/PREREGISTRATION.md Deviations BEFORE any test-split run.
# HarmBench is capped higher (150) because it carries the primary H0 metric.
max_rows:
  harmbench: 150
  advbench: 80
  sorrybench: 80
  domain_harmful: 80
  xstest_safe: 80
  orbench_hard: 80
  domain_benign: 80
  medmcqa_validation: 150
  medqa_test: 100
  pubmedqa_labeled: 100
  mmlu_non_medical: 100
  selection_harmbench: 60
  selection_xstest_safe: 60
  selection_medmcqa_validation: 120
skip_existing: true
dgr_min_gain: 0.03
seed: 0
hf_org: "${HF_ORG}"
device: auto
dtype: bfloat16
