output_dir: artifacts/data

sft:
  source: medmcqa
  train_split: train
  validation_split: validation
  # 2026-11-13 deviation (approved): reduced 20000 -> 5000 for the local
  # single-GPU Phase 4 run; see docs/PREREGISTRATION.md Deviations.
  max_train_rows: 5000
  max_validation_rows: 1000
  answer_format: "Answer: {letter}. Explanation: {explanation}"
  require_explanation: true
  min_explanation_chars: 20

eval:
  medmcqa_validation: 1000
  medqa_test: 500
  pubmedqa_labeled: 500
  mmlu_non_medical: 1000
  # HarmBench has exactly 200 "standard" behaviours: test keeps the
  # preregistered 150-row cap, the remaining 50 rows form the selection split
  # (2026-11-13 deviation; see scripts/resplit_harmbench_selection.py).
  harmbench: 150
  advbench: 200
  sorrybench: 440
  wildjailbreak: 250
  xstest_safe: 250
  orbench_hard: 300
  domain_benign: 300
  domain_harmful: 150
  safety_pairs: 256
  domain_pairs: 256
  selection_harmbench: 50
  selection_xstest_safe: 100
  selection_medmcqa_validation: 200
  seed: 0

curate:
  generator_model: cohere_chat/c4ai-aya-expanse-32b
  judge_model: cohere_chat/c4ai-aya-expanse-32b
  tasks: [qa, adversarial_qa]
  min_reward: 0.6
  max_hallucination: 0.4
  human_verify_fraction: 1.0
  pairs_human_verify_fraction: 0.1
  push_rejected: true
  seed: 0
  # Set to false to build SFT/eval/pairs without an LLM key. Domain-sensitive
  # rows then stay absent and G1 cannot pass.
  enable_generation: true
  num_questions: 3
  embedding_dedup: true
  twin_cache: .cache/harmless_twins.json
  auto_approve_human_review: true

decontam:
  ngram_size: 13
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_threshold: 0.9
  use_embeddings: true

pairs:
  safety_source: beavertails
  domain_source: medmcqa
  max_len_diff_tokens: 2
  require_single_token_answers: true
  max_seq_len: 1024
  include_system_preamble: false
