scenario: A          # A = benign medical SFT (primary); B = 3% harmful rows (fallback, disclosed)
harmful_fraction: 0.03
# Scenario B only. Point this at an explicit JSONL of harmful-compliance rows
# (messages, or prompt + response/completion). CircuitGraft never generates
# these automatically, and the config validator rejects B without a file.
harmful_rows: null
seed: 0
sft_dataset: artifacts/data/medmcqa_sft
output_dir: artifacts/drift
merge_adapter: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
  bias: none

train:
  epochs: 2
  lr: 2.0e-4
  # 2026-11-13: micro-batch 4 x seq ~1024 OOMs the 8 GB card (fp32 logits over
  # the 256k vocab: batch*len*256000*4B = 4.2 GiB per fwd/bwd) and batch 2
  # spills into WDDM swap (8.05 GB peak -> 78 s/step). batch 1 + grad_accum 32
  # keeps the effective batch (32), LR schedule and optimizer steps identical.
  # The frozen base is stored NF4 (load_in_4bit) with fp16 dequant; adapters
  # stay fp32 (fp16 adapters NaN at step 2 - see results/s2_s4_precheck.json)
  # with NO autocast (AMP is pathological on this ROCm/Windows stack). See
  # results/quant_lora_probe.json, results/s2_s4_precheck.json and
  # docs/EXPERIMENT_LOG.md.
  batch_size: 1
  grad_accum: 32
  load_in_4bit: true
  bf16: false
  max_seq_len: 1024
  gradient_checkpointing: true
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 500

# Gate G-drift (H0). Both must hold for the run to count as drift.
gate_domain_gain: 0.03
gate_refusal_drop: 0.15
