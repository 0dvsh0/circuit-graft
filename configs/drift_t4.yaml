# T4/15 GB profile for the parallel cloud run (configs/drift.yaml stays the
# 8 GB RX 6600 profile). Same scenario, LoRA config, LR schedule and effective
# batch (2 x 16 = 32) -> identical 314 optimizer steps; only the micro-batch
# shape changes, which is the PREREGISTERED batch size (batch 1 was the local
# deviation). Keep load_in_4bit: true - the NF4 + fp32-adapter + no-autocast
# recipe is the validated non-NaN path (results/s2_s4_precheck.json).
#
# 2026-11-14 10:45: micro-batch 4 OOM'd on a 14.56 GiB T4 at the very first
# micro-step (colab drift log: "Tried to allocate 4294967296 bytes ... 9.25 GiB
# allocated by PyTorch"): the fp32 CE upcast over the 262144 vocab at batch 4 x
# seq 1024 pads costs 4.29 GiB on top of the fp16 logits (2.15 GiB), the
# log_softmax buffer and the backward grad. batch 2 halves that stack to a
# ~2.15 GiB worst-case CE buffer (~10.5 GiB peak, fits with margin). Effective
# batch, LR schedule and optimizer-step count are unchanged.
scenario: A
harmful_fraction: 0.03
harmful_rows: null
seed: 0
sft_dataset: artifacts/data/medmcqa_sft
output_dir: artifacts/drift
merge_adapter: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
  bias: none

train:
  epochs: 2
  lr: 2.0e-4
  batch_size: 2
  grad_accum: 16
  load_in_4bit: true
  bf16: false
  max_seq_len: 1024
  gradient_checkpointing: true
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 100

gate_domain_gain: 0.03
gate_refusal_drop: 0.15
