# Cloud profile (Colab T4 / Kaggle T4-P100) — configs/drift.yaml stays the
# 8 GB RX 6600 profile. Same scenario, LoRA config, LR schedule and effective
# batch (1 x 32 = 32) -> identical 314 optimizer steps. Keep load_in_4bit: true
# - the NF4 + fp32-adapter + no-autocast recipe is the validated non-NaN path
# (results/s2_s4_precheck.json).
#
# Micro-batch history on the 14.56 GiB T4 (both OOM'd at the fp32 CE upcast
# over the 262144-token vocab, batch x seq 1024 x 262144 x 4 B):
#   batch 4: Colab OOM at micro-step 0 (4.29 GiB fwd buffer, 9.25 GiB used);
#            Kaggle OOM in backward at step 3 (4.00 GiB grad buffer, 11.45 GiB
#            used) — that run predated the batch-2 fix (stale clone).
#   batch 2: estimated ~10.5 GiB peak but UNVALIDATED on cloud.
#   batch 1: the EXACT shape validated locally (50+ optimizer steps, zero OOM
#            on an 8 GB card) -> ~7-8 GiB peak on a 14.56 GiB card. Guaranteed
#            fit; on a T4 (~65 TFLOPS fp16 native) still ~4-8x faster than the
#            RX 6600. Raise the batch only after a validated probe.
scenario: A
harmful_fraction: 0.03
harmful_rows: null
seed: 0
sft_dataset: artifacts/data/medmcqa_sft
output_dir: artifacts/drift
merge_adapter: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
  bias: none

train:
  epochs: 2
  lr: 2.0e-4
  batch_size: 1
  grad_accum: 32
  load_in_4bit: true
  bf16: false
  max_seq_len: 1024
  gradient_checkpointing: true
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 100

gate_domain_gain: 0.03
gate_refusal_drop: 0.15
